<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ca8a04" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Border -->
  <path d="M 100 8 C 145 8, 185 24, 185 24 C 185 110, 155 178, 100 208 C 45 178, 15 110, 15 24 C 15 24, 55 8, 100 8 Z"
        fill="url(#goldGrad)" />

  <!-- Inner Navy Shield Body -->
  <path d="M 100 12 C 142 12, 180 27, 180 27 C 180 108, 152 173, 100 202 C 48 173, 20 108, 20 27 C 20 27, 58 12, 100 12 Z"
        fill="url(#shieldBg)" stroke="url(#goldLight)" stroke-width="1.5" />

  <!-- Shield Interior Gloss Overlay -->
  <path d="M 100 14 C 138 14, 172 28, 172 28 C 172 85, 140 135, 100 140 C 60 135, 28 85, 28 28 C 28 28, 62 14, 100 14 Z"
        fill="url(#blueGlow)" />

  <!-- Laurel Wreath Left Side -->
  <g fill="url(#goldGrad)">
    <path d="M 46 95 C 40 90, 36 80, 42 74 C 47 79, 49 88, 46 95 Z" />
    <path d="M 43 115 C 36 112, 31 103, 35 96 C 41 100, 44 109, 43 115 Z" />
    <path d="M 45 135 C 38 133, 33 124, 37 118 C 43 121, 46 129, 45 135 Z" />
    <path d="M 52 153 C 45 152, 40 143, 44 137 C 50 139, 53 147, 52 153 Z" />
    <path d="M 64 168 C 58 168, 52 161, 55 154 C 61 155, 65 162, 64 168 Z" />
    <path d="M 78 180 C 72 181, 66 175, 69 168 C 75 168, 79 174, 78 180 Z" />
  </g>

  <!-- Laurel Wreath Right Side -->
  <g fill="url(#goldGrad)">
    <path d="M 154 95 C 160 90, 164 80, 158 74 C 153 79, 151 88, 154 95 Z" />
    <path d="M 157 115 C 164 112, 169 103, 165 96 C 159 100, 156 109, 157 115 Z" />
    <path d="M 155 135 C 162 133, 167 124, 163 118 C 157 121, 154 129, 155 135 Z" />
    <path d="M 148 153 C 155 152, 160 143, 156 137 C 150 139, 147 147, 148 153 Z" />
    <path d="M 136 168 C 142 168, 148 161, 145 154 C 139 155, 135 162, 136 168 Z" />
    <path d="M 122 180 C 128 181, 134 175, 131 168 C 125 168, 121 174, 122 180 Z" />
  </g>

  <!-- Laurel Connecting Ribbon / Stem -->
  <path d="M 45 92 Q 40 140 76 182 Q 100 192 100 192 Q 100 192 124 182 Q 160 140 155 92"
        stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g transform="translate(100, 48)">
    <!-- Cap Rhombus Diamond -->
    <path d="M 0 -16 L 36 -3 L 0 10 L -36 -3 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
    <!-- Cap Base / Skull cap -->
    <path d="M -18 3 L -18 13 C -18 19, 18 19, 18 13 L 18 3 C 14 7, -14 7, -18 3 Z" fill="#ca8a04" />
    <!-- Tassel Button & Cord -->
    <circle cx="0" cy="-3" r="2.5" fill="#fef08a" />
    <path d="M 0 -3 Q 22 2 24 14" stroke="#fef08a" stroke-width="1.8" fill="none" />
    <!-- Tassel Fringe -->
    <path d="M 23 14 L 27 22 L 21 22 Z" fill="#fde047" />
  </g>

  <!-- Center Emblem: Golden Stylized Academic 'Z' -->
  <g transform="translate(100, 118)" filter="url(#subtleGlow)">
    <path d="M -28 -34 L 28 -34 L 28 -22 L -8 18 L 28 18 L 28 32 L -28 32 L -28 20 L 8 -20 L -28 -20 Z"
          fill="url(#goldGrad)" />
    <!-- Inner Z Highlight Edge -->
    <path d="M -26 -32 L 26 -32 L 26 -24 L -4 16 L 26 16 L 26 30 L 24 30 L -7 20 L -26 20 Z"
          fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Stars at Bottom -->
  <g fill="url(#goldGrad)">
    <polygon points="100,172 102.5,178 109,178.5 104,183 105.5,189 100,185.5 94.5,189 96,183 91,178.5 97.5,178" />
    <polygon points="85,166 87,171 92,171.5 88,175 89,180 85,177 81,180 82,175 78,171.5 83,171" transform="scale(0.85) translate(14, 18)" opacity="0.85" />
    <polygon points="115,166 117,171 122,171.5 118,175 119,180 115,177 111,180 112,175 108,171.5 113,171" transform="scale(0.85) translate(22, 18)" opacity="0.85" />
  </g>
</svg>
